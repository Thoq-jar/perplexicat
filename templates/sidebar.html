<aside class="sidebar">
    <div class="sidebar-top">
        <a href="{{ url_for('main.index') }}" class="sidebar-logo">
                <i data-lucide="snowflake"></i>
            </a>
        <a href="{{ url_for('main.index') }}" class="sidebar-btn new-chat">
            <i data-lucide="plus"></i>
        </a>
    </div>

    <nav class="sidebar-nav">
        <a href="{{ url_for('main.library') }}" class="sidebar-item">
            <i data-lucide="history"></i>
            <span>History</span>
        </a>
        <a href="{{ url_for('main.spaces_list') }}" class="sidebar-item">
                <i data-lucide="layout-grid"></i>
            <span>Spaces</span>
        </a>
    </nav>

    <div class="sidebar-bottom">
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('main.settings') }}" class="sidebar-item">
                <i data-lucide="user"></i>
                <span>{{ current_user.username[:6] }}</span>
            </a>
        {% else %}
            <a href="{{ url_for('auth.login') }}" class="sidebar-item">
                <i data-lucide="log-in"></i>
                <span>Login</span>
            </a>
        {% endif %}
    </div>
</aside>
