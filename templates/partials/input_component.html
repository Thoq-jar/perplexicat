<div class="search-container{% if chat %} chat-search{% endif %}"{% if chat %} data-chat-id="{{ chat.id }}"{% endif %}>
    <textarea id="search-input" class="search-input input-component" placeholder="{% if chat %}Ask follow-up...{% else %}Ask anything...{% endif %}" rows="1" autofocus></textarea>
    <div class="search-actions">
        <div class="action-group">
            <select id="model-select" class="model-select">
                <option value="gemma3:4b">Gemma 3 4B</option>
                <option value="qwen3-vl:8b">Qwen3-VL 8B</option>
            </select>
            {% if not chat and current_user.is_authenticated and spaces %}
            <select id="space-select" class="model-select">
                <option value="">No Space</option>
                {% for space in spaces %}
                    <option value="{{ space.id }}">{{ space.name }}</option>
                {% endfor %}
            </select>
            {% endif %}
        </div>
        <div class="action-group">
            <button id="submit-btn" class="submit-btn"><i data-lucide="arrow-up"></i></button>
        </div>
    </div>
</div>
